<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b3d2a" />
    <title>Pagar com Pix</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: #0b3d2a;
        color: #fff;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        line-height: 1.4;
        min-height: 100vh;
        padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      h1 {
        font-size: 1.7rem;
        margin: 0 0 6px;
      }
      h2 {
        font-size: 1.05rem;
        margin: 28px 0 4px;
      }
      p {
        margin: 0;
        color: #c9e3d6;
      }
      .key {
        border: 1px solid #2f7a5a;
        border-radius: 14px;
        padding: 16px;
        margin: 20px 0 12px;
      }
      .key b {
        display: block;
        font-size: 1.4rem;
        margin-top: 4px;
        letter-spacing: 0.5px;
        color: #fff;
      }
      button {
        font: inherit;
        cursor: pointer;
        background: #fff;
        color: #0b3d2a;
        border: 2px solid #fff;
        border-radius: 12px;
        font-weight: 700;
      }
      .copy {
        width: 100%;
        padding: 16px;
        font-size: 1.1rem;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
      }
      .grid button {
        padding: 15px 8px;
        font-size: 1rem;
      }
      button:active {
        background: #d9efe3;
      }
      button:focus-visible {
        outline: 3px solid #7dffc0;
        outline-offset: 2px;
      }
      .qr {
        background: #fff;
        border-radius: 14px;
        padding: 8px;
        max-width: 260px;
        margin: 20px auto 16px;
      }
      .qr svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .code {
        width: 100%;
        margin-top: 12px;
        padding: 10px;
        font:
          0.75rem/1.3 ui-monospace,
          Menlo,
          Consolas,
          monospace;
        color: #c9e3d6;
        background: transparent;
        border: 1px solid #2f7a5a;
        border-radius: 12px;
        resize: none;
        word-break: break-all;
      }
      .how {
        margin-top: 24px;
        font-size: 0.92rem;
      }
      #t {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        max-width: 448px;
        margin: 0 auto;
        background: #fff;
        color: #0b3d2a;
        padding: 14px 16px;
        border-radius: 12px;
        font-weight: 700;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      #t.on {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pagar com Pix</h1>
      <p>Escaneie o QR Code ou copie o código e pague no app do seu banco.</p>

      </div>
      <button class="copy" id="copy">Copiar Pix copia e cola</button>
      <textarea
        class="code"
        readonly
        rows="4"
        onclick="this.select()"
        aria-label="Código Pix copia e cola"
      >
00020101021126580014br.gov.bcb.pix0136b16d8617-2fd9-4e45-9308-51035e58b6485204000053039865802BR5920MATHEUS BORGES AVILA6010UBERLANDIA62070503***63040974</textarea
      >

      <h2>Abrir meu banco</h2>
      <p>Toque no seu banco. O código é copiado e o app tenta abrir.</p>
      <div class="grid" id="grid"></div>

      <p class="how">
        No app do banco: Pix → Pix Copia e Cola → colar. Se o app não abrir,
        abra manualmente: o código já está copiado.
      </p>
    </main>
    <div id="t" role="status" aria-live="polite"></div>
    <script>
      var KEY =
        "00020101021126580014br.gov.bcb.pix0136b16d8617-2fd9-4e45-9308-51035e58b6485204000053039865802BR5920MATHEUS BORGES AVILA6010UBERLANDIA62070503***63040974";

      // [nome, pacote Android, esquema iOS]
      var BANKS = [
        ["Nubank", "com.nu.production", "nubank://"],
        ["Caixa", "br.com.gabba.Caixa", "caixa://"],
        ["Banco do Brasil", "br.com.bb.android", "bbapp://"],
        ["Inter", "br.com.intermedium", "bancointer://"],
        ["Bradesco", "com.bradesco", "bradesco://"],
        ["Itaú", "com.itau", "itau://"],
        ["Mercado Pago", "com.mercadopago.wallet", "mercadopago://"],
        ["Santander", "com.santander.app", "santander://"],
        ["PicPay", "com.picpay", "picpay://"],
        ["PagBank", "br.com.uol.ps.myaccount", "pagbank://"],
      ];

      // ---------- detecção de plataforma ----------
      var ua = navigator.userAgent || "";
      var IS_ANDROID = /Android/i.test(ua);
      // iPadOS novo se identifica como "Macintosh", por isso o teste de touch
      var IS_IOS =
        /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      // ---------- toast ----------
      var tt;
      function toast(m) {
        var t = document.getElementById("t");
        t.textContent = m;
        t.className = "on";
        clearTimeout(tt);
        tt = setTimeout(function () {
          t.className = "";
        }, 4000);
      }

      // ---------- copiar ----------
      function copySync() {
        try {
          var a = document.createElement("textarea");
          a.value = KEY;
          a.setAttribute("readonly", "");
          a.style.cssText =
            "position:fixed;top:0;left:0;opacity:0;font-size:16px";
          document.body.appendChild(a);
          a.focus();
          a.select();
          a.setSelectionRange(0, 99);
          var r = document.execCommand("copy");
          document.body.removeChild(a);
          if (r) return true;
        } catch (e) {}
        return false;
      }
      function copyKey() {
        var ok = copySync();
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(KEY);
            ok = true;
          }
        } catch (e) {}
        return ok;
      }
      document.getElementById("copy").onclick = function () {
        toast(
          copyKey()
            ? "Código copiado! Cole em Pix Copia e Cola no app do seu banco."
            : "Não copiou. Toque no código abaixo e copie.",
        );
      };

      // ---------- abrir o app do banco ----------
      function openBank(b) {
        var name = b[0],
          pkg = b[1],
          scheme = b[2];

        if (IS_ANDROID) {
          // Abre o app pelo pacote (launcher). Se não estiver instalado,
          // o Chrome manda para a página do app na Play Store.
          // O Chrome só abre apps que declaram um esquema próprio,
          // então usamos esquema + pacote. Sem fallback automático:
          // se não abrir, o aviso na tela orienta a pessoa.
          location.href =
            "intent://open#Intent" +
            ";scheme=" +
            scheme.replace("://", "") +
            ";package=" +
            pkg +
            ";end";
        } else if (IS_IOS) {
          // iOS: esquema de URL do app (só funciona se o app estiver instalado)
          location.href = scheme;
        } else {
          // Computador: não há app para abrir
          toast("Abra o app do " + name + " no celular e cole a chave em Pix.");
          return false;
        }
        return true;
      }

      var g = document.getElementById("grid");
      BANKS.forEach(function (b) {
        var el = document.createElement("button");
        el.textContent = b[0];
        el.onclick = function () {
          var ok = copyKey();
          if (IS_ANDROID || IS_IOS) {
            toast(
              ok
                ? "Código copiado! Abrindo " + b[0] + "…"
                : "Abrindo " + b[0] + "… copie o código abaixo.",
            );
          }
          if (!openBank(b)) return;

          // Se a página continua visível depois de 1,8s, o app não abriu
          var opened = false;
          function onHide() {
            if (document.hidden) opened = true;
          }
          document.addEventListener("visibilitychange", onHide);
          window.addEventListener("pagehide", function () {
            opened = true;
          });
          setTimeout(function () {
            document.removeEventListener("visibilitychange", onHide);
            if (opened || document.hidden) return;
            toast(
              ok
                ? "Não abriu? Abra o " +
                    b[0] +
                    " e use Pix Copia e Cola. O código já está copiado."
                : "Não abriu? Abra o " +
                    b[0] +
                    " e cole o código em Pix Copia e Cola.",
            );
          }, 1800);
        };
        g.appendChild(el);
      });
    </script>
